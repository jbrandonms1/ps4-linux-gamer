#!/usr/bin/nft -f
# /etc/nftables.conf — Firewall: solo la red local entra a los servicios; todo lo saliente permitido.
# Cambia 192.168.0.0/24 por tu red si es distinta (p. ej. 192.168.1.0/24).
destroy table inet filter
table inet filter {
  set lan4 { type ipv4_addr; flags interval; elements = { 192.168.0.0/24 } }
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp sport 67 udp dport 68 accept                                   # DHCP
    udp dport 5353 accept                                              # mDNS (archlinux-ps4.local)
    ip saddr @lan4 tcp dport 22 accept                                 # SSH (solo llave)
    ip saddr @lan4 tcp dport 1714-1764 accept                          # KDE Connect
    ip saddr @lan4 udp dport 1714-1764 accept
    ip saddr @lan4 udp dport { 27031-27036 } accept                    # Steam Remote Play / LAN
    ip saddr @lan4 tcp dport { 27036, 27037 } accept
  }
  chain forward { type filter hook forward priority filter; policy drop; }
  chain output  { type filter hook output priority filter; policy accept; }
}
